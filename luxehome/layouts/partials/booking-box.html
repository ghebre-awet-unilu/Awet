{{/* Booking form. Context: dict "title" "price" "status" "deposit" */}}
<div
  class="booking-box"
  id="bookingBox"
  data-property-title="{{ .title }}"
  data-price="{{ .price }}"
  data-status="{{ .status }}"
  data-deposit="{{ .deposit }}"
>
  <button type="button" id="bookPropertyBtn" class="btn btn-primary btn-book">
    Book This Property
  </button>

  <form id="bookingForm" class="booking-form" hidden novalidate>
    <p class="booking-amount">
      <span id="bookingAmountLabel">Amount due now</span>
      <strong id="bookingAmount"></strong>
    </p>
    <div class="form-group">
      <label for="bookingName">Full name</label>
      <input type="text" id="bookingName" name="name" required autocomplete="name" placeholder="Your full name">
    </div>
    <div class="form-group">
      <label for="bookingEmail">Email</label>
      <input type="email" id="bookingEmail" name="email" required autocomplete="email" placeholder="you@example.com">
    </div>
    <p class="booking-error" id="bookingError" hidden></p>
    <div class="booking-actions">
      <button type="submit" class="btn btn-primary" id="bookingSubmit">Continue to PayPal</button>
      <button type="button" class="btn btn-outline" id="bookingCancel">Cancel</button>
    </div>
    <p class="booking-note">You will be redirected to PayPal to pay securely.</p>
  </form>
</div>
